# ncs-zigbee's ZBOSS NVRAM backend (subsys/osif/zb_nrf_nvram.c) includes
# <pm_config.h> and uses PM_ZBOSS_NVRAM_ID, which only exist when the NCS
# Partition Manager runs. Partition Manager defaults to 'n' in NCS v3.4, so it
# has to be requested explicitly here (it registers pm.yml.zboss, which defines
# the ZBOSS_NVRAM and ZBOSS_PRODUCT_CONFIG partitions).
SB_CONFIG_PARTITION_MANAGER=y
